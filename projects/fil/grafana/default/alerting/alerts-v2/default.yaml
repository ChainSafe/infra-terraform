rules:
  # Dynamic severity levels
  - alert: Node Metrics Missing
    expr: |
      absent_over_time(
        alloy_build_info{instance =~ "fil-.*"}[5m]
      )
    severities:
      type: gt
      critical: 1
      warning: 1
    for: 10m
    annotations:
      description: "Node {{ $labels.instance }} metrics are missing for 5 minutes"
      summary: "Node metrics are missing"

